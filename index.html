<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Násobilka">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Násobilka - Závodní hra</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="gameContainer">
        <div class="language-selector">
            <button class="lang-btn active" title="Česky">🇨🇿</button>
            <button class="lang-btn" title="English">🇬🇧</button>
        </div>
        <h1 id="gameTitle" style="margin-bottom: 10px; color: #333;">🏎️ Násobilka - Závod</h1>
        <div id="question">3 × 4 = ?</div>
        <div id="score">Správné odpovědi: 0</div>
        <div id="speed">Rychlost: 1.5×</div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="controls" class="controls">Táhni prstem nebo ← → / A D</div>
        <div id="gameOver">
            <h2 id="gameOverTitle">Konec hry!</h2>
            <p id="scoreLabel">Tvoje skóre:<br><strong style="font-size: 32px; color: #667eea;"><span
                        id="finalScore">0</span></strong></p>
            <button id="restartBtn">Hrát znovu</button>
        </div>
    </div>

    <script type="module" src="js/game.js"></script>
    <script>
        // Registrace Service Workeru
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker zaregistrován'))
                .catch(err => console.log('Service Worker chyba:', err));
        }
    </script>
</body>

</html>
